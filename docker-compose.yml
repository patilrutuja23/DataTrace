
services:
  postgres:
    image: postgres:16
    container_name: datatrace-postgres
    environment:
      POSTGRES_USER: datatrace
      POSTGRES_PASSWORD: datatrace_dev
      POSTGRES_DB: datatrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datatrace -d datatrace"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  
  neo4j:
    image: neo4j:5
    container_name: datatrace-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      # NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider http://localhost:7474 || exit 1'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


volumes:
  postgres_data:
  neo4j_data:
